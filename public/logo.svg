<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="wfade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="white" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="white" stop-opacity="1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="48" height="48" rx="13" fill="url(#bg)"/>

  <!-- Three input paths converging (left side, fanning in) -->
  <!-- Top path -->
  <path d="M8 13 Q18 13 22 24" stroke="url(#wfade)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Middle path -->
  <path d="M8 24 L22 24" stroke="url(#wfade)" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <!-- Bottom path -->
  <path d="M8 35 Q18 35 22 24" stroke="url(#wfade)" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Main arrow shaft (right side) -->
  <line x1="22" y1="24" x2="37" y2="24" stroke="white" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Arrow head -->
  <path d="M31 17 L38.5 24 L31 31" stroke="white" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
